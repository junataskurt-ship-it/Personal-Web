    <main class="section-container">
            <h1 class="section-title">CONTACT</h1>
            <div class="contact-grid">
                
                <!-- Right Side: Contact Form Area -->
                <div class="contact-form-card">
                    <div class="form-header">
                        <h2>Get In Touch</h2>
                        <p>Have a project, collaboration, or opportunity? Send me a message.</p>
                    </div>

                    <form class="contact-form">
                        <div class="form-title-bar">
                            <span>Contact Form</span>
                            <span class="status-available"><i class="fa-solid fa-circle"></i> Available</span>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" id="name" placeholder="Enter your name..." required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" placeholder="Where should I send the reply?" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" placeholder="e.g. Collaboration, Freelance Work, Inquiry" required>
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" rows="5" placeholder="Tell me about your project or inquiry..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary submit-btn">Send Message</button>
                    </form>
                </div>
            </div>
        </main>
        <script src="script.js"></script>

    </body>
